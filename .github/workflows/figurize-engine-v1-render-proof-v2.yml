name: Figurize Engine v1 compiled render proof

on:
  push:
    branches:
      - agent/figurize-engine-v1-render-proof
    paths:
      - "validation/**"
      - ".github/workflows/figurize-engine-v1-render-proof-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Render references and compiled Scene Spec with official Manim only
        run: |
          docker run --rm \
            --user root \
            -v "$PWD:/manim" \
            -w /manim/validation \
            manimcommunity/manim:v0.20.1 \
            bash run_v2.sh

      - name: Show validation manifest
        run: cat validation/output_v2/manifest.json

      - name: Upload real compiled Manim artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figurize-engine-v1-compiled-manim-proof
          path: validation/output_v2
          if-no-files-found: error
          retention-days: 30
