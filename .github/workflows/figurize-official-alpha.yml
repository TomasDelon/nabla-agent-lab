name: Figurize official Manim alpha validation

on:
  push:
    branches:
      - agent/figurize-manim-render-validation
    paths:
      - "figurize-official-alpha/official_smoke.py"
      - "figurize-official-alpha/run_official_smoke.sh"
      - "figurize-official-alpha/validate_artifact.py"
      - ".github/workflows/figurize-official-alpha.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-official:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Render with pinned official Manim Community image
        run: |
          docker run --rm \
            --user root \
            -v "$PWD:/manim" \
            -w /manim/figurize-official-alpha \
            manimcommunity/manim:v0.20.1 \
            bash run_official_smoke.sh

      - name: Display validation manifest
        run: cat figurize-official-alpha/artifact/manifest.json

      - name: Publish curated render evidence to branch
        run: |
          sudo chown -R "$USER:$USER" figurize-official-alpha/artifact
          rm -rf figurize-official-alpha/rendered
          mkdir -p figurize-official-alpha/rendered
          cp figurize-official-alpha/artifact/figurize-official-preview.png figurize-official-alpha/rendered/
          cp figurize-official-alpha/artifact/figurize-official-transparent.png figurize-official-alpha/rendered/
          cp figurize-official-alpha/artifact/manifest.json figurize-official-alpha/rendered/
          cp figurize-official-alpha/artifact/font-and-runtime-report.txt figurize-official-alpha/rendered/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figurize-official-alpha/rendered
          if git diff --cached --quiet; then
            echo "Rendered evidence is unchanged."
          else
            git commit -m "Publish official Manim render evidence"
            git push
          fi

      - name: Upload official Manim render evidence
        uses: actions/upload-artifact@v4
        with:
          name: figurize-official-alpha-smoke
          path: figurize-official-alpha/artifact
          if-no-files-found: error
          retention-days: 30
